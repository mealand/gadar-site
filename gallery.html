<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery | Weddings, Functions and Shows by Gadar Events</title>
  <meta name="description" content="Browse weddings, government functions, entertainment shows, catering and ushering by Gadar Events. Experience Gadar." />
  <link rel="canonical" href="https://gadarevents.com/gallery.html" />
  <!-- @include head -->
</head>
<body data-page="gallery">
  <!-- @include chrome -->
  <!-- @include header -->

  <main id="main">
    <section class="page-hero">
      <div class="page-hero__bg"><img src="/assets/images/wedding-fog-sparklers.jpg" alt="" /></div>
      <div class="container">
        <p class="eyebrow" data-reveal>Gallery</p>
        <h1 data-split>Moments we have had the honour to <em>create</em></h1>
        <p class="lead" data-reveal>A glimpse into the weddings, state functions and shows we have planned, hosted and served. Experience Gadar.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 0">
      <div class="container">
        <div class="filters" role="toolbar" aria-label="Filter gallery" data-reveal>
          <button class="filter is-active" data-filter="all">All</button>
          <button class="filter" data-filter="wedding">Weddings</button>
          <button class="filter" data-filter="government">Government</button>
          <button class="filter" data-filter="entertainment">Entertainment</button>
          <button class="filter" data-filter="catering">Catering</button>
          <button class="filter" data-filter="ushering">Ushering</button>
          <button class="filter" data-filter="decor">Decor</button>
        </div>
        <!-- Items load from public/assets/gallery.json. Add real photos and videos there. -->
        <div class="gallery-grid" data-gallery></div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container">
        <p class="eyebrow" data-reveal>Follow the Journey</p>
        <h2 class="title" data-split>More moments on <em>social</em></h2>
        <div class="social-strip">
          <a class="social-card" href="https://www.instagram.com/gadarevents/" target="_blank" rel="noopener" data-reveal data-cursor="Open">
            <span>Instagram</span><strong>@gadarevents</strong>
          </a>
          <a class="social-card" href="https://www.instagram.com/gadarushering" target="_blank" rel="noopener" data-reveal data-cursor="Open">
            <span>Instagram</span><strong>@gadarushering</strong>
          </a>
          <a class="social-card" href="https://www.facebook.com/profile.php?id=100044502134952" target="_blank" rel="noopener" data-reveal data-cursor="Open">
            <span>Facebook</span><strong>Gadar Events</strong>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- @include footer -->
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
