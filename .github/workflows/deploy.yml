name: Build and deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # SFTP is used when its key is set (recommended on Namecheap); FTPS otherwise or if SFTP fails.
      USE_SSH: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (includes the dash check)
        run: npm run build

      - name: Upload to Namecheap over SFTP
        id: sftp
        if: env.USE_SSH == 'true'
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '21098' }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
          SSH_TARGET_DIR: ${{ vars.SSH_TARGET_DIR }}
          SITE_DOMAIN: gadarevents.com
        run: |
          install -m 700 -d ~/.ssh
          # Keys copied on Windows can carry CRLF line endings, which ssh rejects.
          key=$(printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r')
          # A key pasted onto a single line (spaces instead of line breaks) is rebuilt.
          if [ "$(printf '%s\n' "$key" | wc -l)" -lt 3 ] && printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            body=$(printf '%s' "$key" | sed -E 's/.*-----BEGIN [A-Z ]+-----//; s/-----END.*//' | tr -s ' ' '\n' | sed '/^$/d')
            key=$(printf -- '-----BEGIN OPENSSH PRIVATE KEY-----\n%s\n-----END OPENSSH PRIVATE KEY-----' "$body")
          fi
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # A key protected by a passphrase is unlocked for this run only.
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            if ! ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
              echo "::error::SSH_KEY_PASSPHRASE does not unlock SSH_PRIVATE_KEY. Check the passphrase or remove that secret."
              exit 1
            fi
          fi
          if ! err=$(ssh-keygen -y -P '' -f ~/.ssh/deploy_key 2>&1 >/dev/null); then
            # Describe what was received without printing the key itself.
            first=$(head -n1 ~/.ssh/deploy_key | cut -c1-36)
            echo "Received $(wc -l < ~/.ssh/deploy_key) lines starting with: $first"
            echo "ssh-keygen says: $err"
            case "$first" in
              ssh-ed25519*|ssh-rsa*) hint="This is the PUBLIC key (gadar_deploy.pub). The secret needs the private file gadar_deploy, without .pub." ;;
              -----BEGIN*) if printf '%s' "$err" | grep -qi passphrase; then hint="The key has a passphrase. Add it as the secret SSH_KEY_PASSPHRASE, or make a new key and press Enter twice so the passphrase is empty."; else hint="The key looks cut off or altered. Copy the whole gadar_deploy file again, including the BEGIN and END lines."; fi ;;
              *) hint="The secret does not start with -----BEGIN OPENSSH PRIVATE KEY-----. Paste the whole gadar_deploy file." ;;
            esac
            echo "::error::SSH_PRIVATE_KEY is not usable. $hint"
            exit 1
          fi
          if ! ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || ! [ -s ~/.ssh/known_hosts ]; then
            echo "::error::No SSH server answered at $SSH_HOST port $SSH_PORT. On Namecheap use ftp.gadarevents.com or the server name from cPanel (for example server123.web-hosting.com), not the bare domain."
            exit 1
          fi
          # The host allows file transfer (SFTP) but no shell, so everything below uses SFTP only.
          sftp_run() { sftp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=30 -b "$1" "$SSH_USERNAME@$SSH_HOST"; }
          printf 'ls -1\n' > /tmp/probe.sftp
          if ! home=$(sftp_run /tmp/probe.sftp 2>&1); then
            echo "::error::SFTP sign in failed: $(printf '%s' "$home" | tail -n 2 | tr '\n' ' '). Check SSH_USERNAME is your cPanel username and that the key is Authorized in cPanel > SSH Access > Manage SSH Keys."
            exit 1
          fi
          home=$(printf '%s\n' "$home" | grep -v '^sftp>' | tr -s ' \n' '\n' | sed '/^$/d')
          echo "::notice::Home folder: $(printf '%s' "$home" | tr '\n' ' ')"

          # Find the folder the domain is served from: the one already holding the site's 404.html.
          target="$SSH_TARGET_DIR"
          if [ -z "$target" ]; then
            candidates="public_html/$SITE_DOMAIN $SITE_DOMAIN $(printf '%s\n' "$home" | grep -i gadar | tr '\n' ' ') public_html"
            for d in $candidates; do
              printf 'ls %s/404.html\n' "$d" > /tmp/check.sftp
              if sftp_run /tmp/check.sftp > /dev/null 2>&1; then target="$d"; break; fi
            done
          fi
          if [ -z "$target" ]; then
            echo "::error::Could not find the folder $SITE_DOMAIN is served from (checked: $candidates). Set the repository variable SSH_TARGET_DIR to the Document Root shown in cPanel > Domains."
            exit 1
          fi
          echo "::notice::Uploading to $target"

          # One explicit mkdir and put per item, so nothing depends on how the server copies folders.
          # The server config and visitor uploads are not part of the build, so they are never touched.
          (
            cd dist
            find . -mindepth 1 -type d | sed 's#^\./##' | sort | while read -r d; do printf -- '-mkdir "%s/%s"\n' "$target" "$d"; done
            find . -type f | sed 's#^\./##' | sort | while read -r f; do printf 'put "%s" "%s/%s"\n' "$f" "$target" "$f"; done
          ) > /tmp/upload.sftp
          files=$(grep -c '^put ' /tmp/upload.sftp)
          (cd dist && sftp_run /tmp/upload.sftp > /tmp/upload.log 2>&1) || {
            echo "::error::SFTP upload stopped: $(grep -v '^sftp>' /tmp/upload.log | tail -n 3 | tr '\n' ' ')"
            exit 1
          }
          echo "::notice::Uploaded $files files to $target over SFTP"

      # FTPS data connections on shared hosting sometimes time out, so the upload is retried.
      # Each attempt resumes from what the server already has.
      - name: Upload to Namecheap over FTPS
        id: ftp1
        if: env.USE_SSH != 'true' || steps.sftp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./dist/
          # The FTP account is created with public_html as its home folder, so upload to its root.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            api/lib/config.php
            uploads/experiences/**

      - name: Retry FTPS upload
        id: ftp2
        if: (env.USE_SSH != 'true' || steps.sftp.outcome == 'failure') && steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            api/lib/config.php
            uploads/experiences/**

      - name: Final FTPS attempt
        if: (env.USE_SSH != 'true' || steps.sftp.outcome == 'failure') && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            api/lib/config.php
            uploads/experiences/**
